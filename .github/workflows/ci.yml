# Tests every push and pull request, builds the web version and an Android debug APK,
# and publishes the web build to GitHub Pages from main.
# One-time setup for Pages: repository Settings > Pages > Source: "GitHub Actions".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.3-stable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSLo godot.zip "$GODOT_URL/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project
        run: $GODOT --headless --path . --import || true
      - name: Compile check
        run: $GODOT --headless --path . res://tests/compile_all.tscn
      - name: Combat
        run: $GODOT --headless --fixed-fps 60 --path . res://scripts/combat/combat_test.tscn
      - name: UI
        run: $GODOT --headless --fixed-fps 60 --path . res://scripts/ui/ui_test.tscn
      - name: Team Deathmatch
        run: $GODOT --headless --fixed-fps 60 --path . res://tests/team_test.tscn
      - name: Maps and loadouts
        run: $GODOT --headless --fixed-fps 60 --path . res://tests/map_test.tscn
      - name: Driving and AI
        run: $GODOT --headless --fixed-fps 60 --path . res://scripts/kart/kart_test_scene.tscn -- --frames=1500
      - name: End-to-end
        run: $GODOT --headless --fixed-fps 60 --path . res://scripts/game/integration_test.tscn
      - name: LAN multiplayer (host + client processes)
        run: tests/run_net_test.sh lan
      - name: Online multiplayer (mock Supabase Realtime)
        run: |
          pip install websockets
          tests/run_net_test.sh online

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.3-stable
      - name: Install Godot and export templates
        run: |
          curl -sSLo godot.zip "$GODOT_URL/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
          T="$HOME/.local/share/godot/export_templates/4.3.stable"
          if [ ! -f "$T/web_nothreads_release.zip" ]; then
            curl -sSLo templates.tpz "$GODOT_URL/Godot_v4.3-stable_export_templates.tpz"
            unzip -q templates.tpz -d tpl
            mkdir -p "$T" && mv tpl/templates/* "$T/"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;34.0.0 platform-tools"
      - name: Import project
        run: $GODOT --headless --path . --import || true
      - name: Export web
        run: |
          mkdir -p build/web
          $GODOT --headless --path . --export-release Web build/web/index.html
          test -f build/web/index.wasm
      - name: Export Android debug APK
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            mkdir -p "$HOME/.config/godot"
            cat > "$HOME/.config/godot/$f" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          done
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          mkdir -p build/android
          $GODOT --headless --path . --export-debug Android build/android/KartClash-debug.apk
          test -f build/android/KartClash-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kart-clash-web
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: kart-clash-android-debug-apk
          path: build/android/KartClash-debug.apk
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: build/web

  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
